name: CI/CD — Build & Deploy Rezoli

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/rezoli

jobs:
    # ────────────────────────────────────────────────────────────────
    # JOB 1 — Lint & type-check
    # ────────────────────────────────────────────────────────────────
    lint:
        name: Lint & Type-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.12.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm exec prisma generate

            - name: Run ESLint
              run: pnpm lint

            - name: Run TypeScript check
              run: pnpm typecheck

    # ─────────────────────────────────────────────────────────────────
    # JOB 2 — Build Docker image & push to GHCR
    # ─────────────────────────────────────────────────────────────────
    build-and-push:
        name: Build & Push Image
        runs-on: ubuntu-latest
        needs: lint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            packages: write

        outputs:
            image-tag: ${{ steps.meta.outputs.version }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
                      NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
                      NEXT_PUBLIC_EMAIL_FROM=${{ secrets.NEXT_PUBLIC_EMAIL_FROM }}
                  cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    # ─────────────────────────────────────────────────────────────────
    # JOB 3 — Deploy to VPS via SSH
    # ─────────────────────────────────────────────────────────────────
    deploy:
        name: Deploy to VPS
        runs-on: ubuntu-latest
        needs: build-and-push
        environment:
            name: production

        steps:
            - name: Checkout (for docker-compose.yml)
              uses: actions/checkout@v4

            - name: Copy docker-compose.yml to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  source: docker-compose.yml
                  target: ~/apps/resoli/

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  envs: IMAGE_TAG,GITHUB_REPOSITORY_OWNER
                  script: |
                      set -e

                      cd ~/apps/resoli

                      echo "${{ secrets.GITHUB_TOKEN }}" \
                        | docker login ghcr.io \
                            -u ${{ github.actor }} \
                            --password-stdin

                      export IMAGE_TAG=sha-$(echo "${{ github.sha }}" | cut -c1-7)
                      export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

                      docker compose pull rezoli
                      docker compose up -d --remove-orphans
                      docker image prune -a -f || true

                      echo "✅ Deployed image tag: $IMAGE_TAG"

              env:
                  IMAGE_TAG: sha-${{ github.sha }}
